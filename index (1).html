<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EEF0EA;
    --paper-2:#E5E8DE;
    --ink:#15171A;
    --ink-soft:#4B4E48;
    --accent:#1F5C4D;
    --accent-soft:#DCE7DF;
    --gold:#B8901F;
    --line:#C7C9BE;
    --error:#B23A2E;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;
    max-width:840px;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px 2px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(34px,6vw,58px);
    line-height:1.02;
    letter-spacing:-0.01em;
    margin:0 0 12px 0;
  }
  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--accent);
  }
  .sub{
    font-size:16px;
    color:var(--ink-soft);
    max-width:46ch;
    margin:0 0 36px 2px;
    line-height:1.5;
  }
  .ticket{
    display:grid;
    grid-template-columns:200px 1fr;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 0 rgba(0,0,0,0.02);
    overflow:hidden;
  }
  .stub{
    background:var(--ink);
    color:var(--paper);
    padding:28px 22px;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .stub::after{
    content:"";
    position:absolute;
    top:0; right:-1px; bottom:0;
    width:2px;
    background-image:radial-gradient(circle,var(--paper) 2.6px,transparent 3px);
    background-size:100% 15px;
    background-repeat:repeat-y;
  }
  .stub-label{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#9BA39A;
  }
  .stub-number{
    font-family:'Space Mono',monospace;
    font-size:30px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.02em;
    margin:8px 0 24px 0;
  }
  .stub-status{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--paper);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  form{
    padding:30px 30px 26px 30px;
  }
  .field{
    margin-bottom:18px;
  }
  label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  input{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    color:var(--ink);
    padding:8px 2px;
    outline:none;
    transition:border-color 0.15s ease;
  }
  input::placeholder{color:#B7BAB1;}
  input:focus{border-bottom-color:var(--accent);}
  input.invalid{border-bottom-color:var(--error);}
  .err{
    font-size:12.5px;
    color:var(--error);
    margin-top:5px;
    min-height:16px;
    font-family:'Space Grotesk',sans-serif;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 110px;
    gap:16px;
  }
  button{
    margin-top:10px;
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    padding:14px 18px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.01em;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button:hover{background:var(--accent);}
  button:disabled{opacity:0.55;cursor:default;}
  .fine{
    text-align:center;
    font-size:12px;
    color:#8C8F87;
    margin-top:14px;
  }
  .success{
    display:none;
    padding:60px 30px;
    text-align:center;
  }
  .success.show{display:block;}
  .success .check{
    width:46px;height:46px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px auto;
    font-size:22px;
  }
  .success h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 8px 0;
  }
  .success p{color:var(--ink-soft);font-size:15px;margin:0;}
  .hide{display:none !important;}

  @media (max-width:600px){
    .ticket{grid-template-columns:1fr;}
    .stub{
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      padding:16px 20px;
    }
    .stub-number{margin:0;font-size:22px;}
    .stub::after{
      top:auto; left:0; right:0; bottom:-1px;
      width:auto; height:2px;
      background-image:radial-gradient(circle,var(--paper) 2.6px,transparent 3px);
      background-size:15px 100%;
      background-repeat:repeat-x;
    }
    form{padding:26px 22px;}
    .row2{grid-template-columns:1fr 96px;gap:12px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Registration</div>
  <h1>You're on <em>the list.</em></h1>
  <p class="sub">Drop your info below to get registered. Takes about 20 seconds — no spam, just confirmation you're in.</p>

  <div class="ticket">
    <div class="stub">
      <div>
        <div class="stub-label">Entry No.</div>
        <div class="stub-number" id="stubNumber">— — — —</div>
      </div>
      <div class="stub-status"><span class="dot"></span> Open</div>
    </div>

    <div id="formWrap">
      <form id="regForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Jordan Rivera" autocomplete="name" required>
          <div class="err" id="err-name"></div>
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="Whittier, CA" autocomplete="address-level2" required>
          <div class="err" id="err-city"></div>
        </div>
        <div class="row2">
          <div class="field" style="margin-bottom:0;">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" placeholder="(562) 555-1234" inputmode="numeric" required>
            <div class="err" id="err-phone"></div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="21" min="1" max="120" required>
            <div class="err" id="err-age"></div>
          </div>
        </div>
        <button type="submit" id="submitBtn">Claim your spot</button>
        <div class="fine">By registering you agree to be contacted about this list.</div>
      </form>
    </div>

    <div class="success" id="successMsg">
      <div class="check">✓</div>
      <h2>You're in.</h2>
      <p>Your registration was received. See you soon.</p>
    </div>
  </div>
</div>

<script>
  // ── Configure these two values from your Supabase project (Settings → API) ──
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const TABLE_NAME = "registrations";
  // ──────────────────────────────────────────────────────────────────────────

  let supabase = null;
  const configured = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
  if (configured) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const stubNumberEl = document.getElementById('stubNumber');

  async function loadCount(){
    if(!configured){ stubNumberEl.textContent = "NEW"; return; }
    try{
      const { count, error } = await supabase.from(TABLE_NAME).select('*', { count: 'exact', head: true });
      if(error) throw error;
      const next = (count || 0) + 1;
      stubNumberEl.textContent = String(next).padStart(5,'0');
    }catch(e){
      stubNumberEl.textContent = "— — —";
    }
  }
  loadCount();

  // Phone auto-format: (XXX) XXX-XXXX
  const phoneInput = document.getElementById('phone');
  phoneInput.addEventListener('input', () => {
    let digits = phoneInput.value.replace(/\D/g,'').slice(0,10);
    let out = digits;
    if(digits.length > 6) out = `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
    else if(digits.length > 3) out = `(${digits.slice(0,3)}) ${digits.slice(3)}`;
    else if(digits.length > 0) out = `(${digits}`;
    phoneInput.value = out;
    phoneInput.dataset.digits = digits;
  });

  function setError(id, msg){
    document.getElementById(id).textContent = msg || '';
    const inputId = id.replace('err-','');
    document.getElementById(inputId).classList.toggle('invalid', !!msg);
  }

  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const city = document.getElementById('city').value.trim();
    const age = document.getElementById('age').value.trim();
    const phoneDigits = (phoneInput.dataset.digits || phoneInput.value.replace(/\D/g,''));

    let valid = true;
    setError('err-name',''); setError('err-city',''); setError('err-age',''); setError('err-phone','');

    if(!name){ setError('err-name','Enter your full name.'); valid = false; }
    if(!city){ setError('err-city','Enter your city.'); valid = false; }
    if(!age || Number(age) < 1 || Number(age) > 120){ setError('err-age','Enter a valid age.'); valid = false; }
    if(phoneDigits.length !== 10){ setError('err-phone','Enter a 10-digit US phone number.'); valid = false; }

    if(!valid) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Registering…';

    const formattedPhone = `(${phoneDigits.slice(0,3)}) ${phoneDigits.slice(3,6)}-${phoneDigits.slice(6)}`;

    try{
      if(configured){
        const { error } = await supabase.from(TABLE_NAME).insert([{
          name, city, age: Number(age), phone: formattedPhone
        }]);
        if(error) throw error;
      } else {
        console.warn('Supabase not configured — entry not saved:', { name, city, age, phone: formattedPhone });
      }
      document.getElementById('formWrap').classList.add('hide');
      document.querySelector('.stub-status').innerHTML = '<span class="dot"></span> Confirmed';
      document.getElementById('successMsg').classList.add('show');
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Claim your spot';
      setError('err-phone', 'Something went wrong. Please try again.');
      console.error(err);
    }
  });
</script>

</body>
</html>
